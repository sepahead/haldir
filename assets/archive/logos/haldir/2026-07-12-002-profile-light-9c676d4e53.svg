<svg xmlns="http://www.w3.org/2000/svg" viewBox="262 78 124 124" width="124" height="124" role="img" aria-label="HALDIR historical profile mark"><title>HALDIR historical profile mark</title><desc>Archived design extracted from a historical portfolio SVG. This image makes no current product or release claim.</desc><defs><radialGradient id="hdGrad" cx="50%" cy="40%" r="68%">
