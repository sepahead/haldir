# Human-reviewable pin source of truth. `tools/verify-pins.py` enforces these.
# A branch name or short SHA is never an acceptable pin.

schema_version = 4

[toolchain]
rust_channel = "1.96.0"
edition = "2024"
components = ["rustfmt", "clippy"]

[ncp]
# Immutable NCP 1.0 candidate. The candidate is untagged upstream, so the commit
# is its identity and `tag` names the package version. Haldir keeps stable
# semantic types; the optional exact adapter compiles the upstream crate here.
tag = "1.0.0-rc.1"
commit = "2819dae3b6338bb1df6d105ebb5b7433936a993d"
wire_version = "1.0"
contract_hash = "163acc57d8a62b66"
# sha256 of proto/ncp.proto at the commit, measured locally on 2026-10-01.
proto_sha256 = "9c127c8e795105da73dddfe47b671bf1f4ee895958ea5f35eda8b37cc503d510"
command_vector_sha256 = "7f6aad14820f52330fa9517ec322644a090225dfd3c0cd99e15961bb0d3efd33"
command_schema_sha256 = "3203e44dc071433c333340201250b345afb0c78cf74e9a01b023d6624f6b6092"
enabled_increment = 1
capability_profile = "NCP_1_0_COMMANDER_LEASE"

[zenoh]
# The Zenoh release that NCP 1.0 also pins. Haldir compiles only the TLS link;
# the live transport feature itself remains off by default.
version = "1.9.0"
default_features = false
features = ["transport_tls"]

[live_transport]
# Official Rust 1.96.0 Bookworm multi-platform index used only to compile and
# run the disposable receiver-observed ACL probe inside the Docker network.
probe_builder_image = "docker.io/library/rust@sha256:5e2214abe154fe26e39f64488952e5c991eeed1d6d6da7cc8381ae83927f0cfc"
# Exact router image is duplicated from the source profile so pin verification
# can reject a harness/profile split before a live campaign is attempted.
router_image = "docker.io/eclipse/zenoh@sha256:157965d71e0bfd0a044d76a985ff0e5c306ad3968929168fb9678cd2a7fec23f"

[dependencies]
# All pinned in Cargo.lock; justification in docs/DEPENDENCY-RATIONALE.md.
ed25519-compact = "2.3.1"
curve25519-dalek = "4.1.3"
sha2 = "0.10"
zeroize = "1"
subtle = "2.6.1"
getrandom = "0.2"
proptest = "1"
rustix = "1.1.4"
ncp-core = "1.0.0-rc.1@2819dae3b6338bb1df6d105ebb5b7433936a993d"
serde_json = "1.0"
hmac = "0.12.1"
tokio = "1"
zenoh = "1.9.0"
zenoh-transport = "1.9.0@6b93b15d0795748b7f76c72eae07f1cda517e762"

[supply_chain.cargo_deny]
# Protected CI installs and invokes this release directly; no cargo-deny
# GitHub Action is admitted. The binary and RustSec database are independently
# verified before the final network-isolated `--frozen` check.
version = "0.20.2"

[supply_chain.cargo_deny.advisory_db]
# Official RustSec snapshot measured independently on 2026-10-23. The archive
# is accepted only while the upstream commit timestamp is less than 90 days
# old. Safe extraction reconstructs the exact Git tree and a deterministic
# local commit at cargo-deny's canonical database directory.
repository_url = "https://github.com/RustSec/advisory-db"
archive_url = "https://codeload.github.com/RustSec/advisory-db/tar.gz/640bf5a9f06e66d8721e8772766531fe77c8630d"
commit = "640bf5a9f06e66d8721e8772766531fe77c8630d"
committed_at = "2026-10-22T12:49:47+02:00"
tree = "47f7d22dbceeeb61ec1115bc394d1383bf4f28ea"
seed_commit = "ea04833412258031945eff663c81f93553120406"
database_directory = "advisory-db-3157b0e258782691"
maximum_staleness_days = 90
archive_bytes = 516533
archive_sha256 = "9ae56c8895aa880de9d0820868b5c621077b6cb5d07ef8c024188de183fb372e"
tar_bytes = 3051520
tar_sha256 = "ec6cd0f48013f3f88d57c6cf73693d218b906e14946ab8602fab359cd4b436c5"
member_count = 2344
regular_file_count = 1368
directory_count = 976
