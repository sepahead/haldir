<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600" role="img" aria-labelledby="title desc" xml:lang="en" focusable="false">
  <title id="title">Galadriel research evidence stops before Haldir authority</title>
  <desc id="desc">Publication diagram with explicit source-to-method joins. A latent drone scenario produces an ordered pre-fusion sensor row and separately generated targets. NIS, CUSUM, signed correlation, pairwise KSG mutual information, co-information, O-information, and categorical MGW remain distinct methods. Only categorical MGW receives a target. Typed research evidence may reach a future record-only audit writer, but a red stop marks the forbidden edge into trusted state, policy, authorization, or plant commands. Haldir authority remains an independent authenticated conjunction.</desc>
  <defs>
    <style>
      text { font-family: "Source Sans 3", "Source Sans Pro", Inter, Arial, Helvetica, sans-serif; }
      .background { fill: #F7F3E9; }
      .panel { fill: #FCFBF7; stroke: #D2E0E2; stroke-width: 2; }
      .scenario { fill: #e8f2ff; stroke: #1769aa; stroke-width: 2.5; }
      .sensor { fill: #e9f8f1; stroke: #087f5b; stroke-width: 2.5; }
      .method { fill: #f3edff; stroke: #7048e8; stroke-width: 2.3; }
      .diagnostic { fill: #edf8ff; stroke: #1971c2; stroke-width: 2.1; }
      .invariant { fill: #fff8e6; stroke: #b46900; stroke-width: 2.1; }
      .evidence { fill: #eef3f8; stroke: #54708a; stroke-width: 2.5; }
      .authority { fill: #fff5db; stroke: #a86200; stroke-width: 2.5; }
      .firewall { fill: #fff0ef; stroke: #c92a2a; stroke-width: 3; }
      .title { font-size: 38px; font-weight: 700; fill: #1F3F60; }
      .subtitle { font-size: 19px; font-weight: 400; fill: #3F596F; }
      .section { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #1F3F60; }
      .box-title { font-size: 22px; font-weight: 700; fill: #2C3E50; }
      .method-title { font-size: 18px; font-weight: 700; fill: #2C3E50; }
      .body { font-size: 17px; font-weight: 400; fill: #2C3E50; }
      .small { font-size: 15px; font-weight: 400; fill: #3F596F; }
      .micro { font-size: 13px; font-weight: 600; fill: #3F596F; letter-spacing: .3px; }
      .mono { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 17px; font-weight: 400; fill: #2C3E50; }
      .mono-small { font-family: "IBM Plex Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 400; fill: #2C3E50; }
      .badge { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .danger { font-size: 17px; font-weight: 700; fill: #9b1c1c; }
      .edge { fill: none; stroke: #54708a; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
      .scenario-edge { fill: none; stroke: #1769aa; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .method-edge { fill: none; stroke: #7048e8; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .authority-edge { fill: none; stroke: #a86200; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .arrowhead { fill: #54708a; }
      .arrowhead-blue { fill: #1769aa; }
      .arrowhead-purple { fill: #7048e8; }
      .arrowhead-gold { fill: #a86200; }
      .bus { fill: none; stroke: #8aa0b4; stroke-width: 2; }
      .dashed { stroke-dasharray: 9 8; }
      .hairline { stroke: #D2E0E2; stroke-width: 1; }
      .title-rule { stroke: #916400; stroke-width: 1.6; }
      .title-rule-accent { stroke: #1F3F60; stroke-width: 3; }
      .registration-diamond { fill: #F7F3E9; stroke: #916400; stroke-width: 1.8; }
    </style>
  </defs>

  <rect class="background" width="1800" height="1600"/>
  <text class="title" x="60" y="60">Research evidence stops before Haldir authority</text>
  <text class="subtitle" x="60" y="94">Exact question identity, explicit abstention, and a record-only boundary prevent scientific outputs from becoming implicit control.</text>
  <line x1="60" y1="108" x2="1740" y2="108" class="title-rule" aria-hidden="true"/>
  <line x1="60" y1="112" x2="260" y2="112" class="title-rule-accent" aria-hidden="true"/>
  <path d="M1740 102 L1746 108 L1740 114 L1734 108 Z" class="registration-diamond" aria-hidden="true"/>

  <rect class="panel" x="45" y="124" width="1710" height="635" rx="22"/>
  <text class="section" x="72" y="158">A · SYNTHETIC LAW AND DISTINCT GALADRIEL QUESTIONS</text>

  <g id="scenario-state" data-node="scenario-state">
    <rect class="scenario" x="72" y="184" width="340" height="142" rx="17"/>
    <rect x="94" y="190" width="116" height="23" rx="11" fill="#1769aa"/>
    <text class="badge" x="108" y="207">FIXTURE ORIGIN</text>
    <text class="box-title" x="94" y="238">Latent ENU scenario</text>
    <text class="mono" x="94" y="269">p = (E, N, U) m</text>
    <text class="small" x="94" y="296">Synthetic canonical law; not field truth.</text>
  </g>

  <g id="sensor-row" data-node="sensor-row">
    <rect class="sensor" x="518" y="184" width="535" height="142" rx="17"/>
    <text class="box-title" x="542" y="220">Ordered pre-fusion sensor rows</text>
    <text class="mono" x="542" y="253">S = (V visual, R radar, A acoustic)</text>
    <text class="body" x="542" y="282">Declared episode/window · bounded six-field summary</text>
    <text class="small" x="542" y="307">No accepted fused verdict enters any method.</text>
  </g>

  <g id="target" data-node="target">
    <rect class="scenario" x="1160" y="184" width="568" height="142" rx="17"/>
    <text class="box-title" x="1184" y="220">Separately derived target identity</text>
    <text class="mono" x="1184" y="253">T_H = 1[E≤50m ∧ N≤1m] · T_V = T_H·1[U≤1m]</text>
    <text class="body" x="1184" y="282">Latent ENU branch; no source-field, fusion, or PID read.</text>
    <text class="small" x="1184" y="307">Not producer-independent field ground truth.</text>
  </g>

  <path class="scenario-edge" d="M 412 255 H 518" data-edge="scenario-state->sensor-row" data-source="scenario-state" data-target="sensor-row"/>
  <path class="arrowhead-blue" d="M 518 255 L 504 247 L 504 263 Z" aria-hidden="true"/>
  <path class="scenario-edge" d="M 412 215 H 462 V 167 H 1100 V 255 H 1160" data-edge="scenario-state->target" data-source="scenario-state" data-target="target"/>
  <path class="arrowhead-blue" d="M 1160 255 L 1146 247 L 1146 263 Z" aria-hidden="true"/>
  <rect x="720" y="151" width="340" height="26" rx="13" fill="#ffffff" stroke="#8fb8dd"/>
  <text class="small" x="740" y="170">same latent law · separate retained identities</text>

  <g id="operational-methods" data-node="operational-methods">
    <rect class="sensor" x="72" y="388" width="700" height="210" rx="18"/>
    <text class="box-title" x="96" y="423">Operational diagnostics · target-free</text>
    <text class="small" x="96" y="449">Each keeps its own statistic, state, threshold, and disposition.</text>

    <g id="nis" data-node="nis">
      <rect class="diagnostic" x="96" y="471" width="202" height="94" rx="13"/>
      <text class="method-title" x="117" y="504">NIS</text>
      <text class="small" x="117" y="530">normalized innovation</text>
      <text class="small" x="117" y="551">magnitude</text>
    </g>
    <g id="cusum" data-node="cusum">
      <rect class="diagnostic" x="320" y="471" width="202" height="94" rx="13"/>
      <text class="method-title" x="341" y="504">CUSUM</text>
      <text class="small" x="341" y="530">sequential-change</text>
      <text class="small" x="341" y="551">accumulator</text>
    </g>
    <g id="signed-correlation" data-node="signed-correlation">
      <rect class="diagnostic" x="544" y="471" width="204" height="94" rx="13"/>
      <text class="method-title" x="565" y="504">Signed correlation</text>
      <text class="small" x="565" y="530">direction-bearing</text>
      <text class="small" x="565" y="551">linear association</text>
    </g>
  </g>

  <g id="dependence-methods" data-node="dependence-methods">
    <rect class="invariant" x="806" y="388" width="420" height="210" rx="18"/>
    <text class="box-title" x="830" y="423">Dependence objects · target-free</text>
    <g id="ksg-mi" data-node="ksg-mi">
      <rect class="diagnostic" x="830" y="452" width="372" height="42" rx="11"/>
      <text class="method-title" x="850" y="480">Pairwise KSG MI</text>
      <text class="micro" x="1175" y="478" text-anchor="end">CONTINUOUS LAW ONLY</text>
    </g>
    <g id="co-information" data-node="co-information">
      <rect class="invariant" x="830" y="510" width="176" height="60" rx="11"/>
      <text class="method-title" x="849" y="537">Co-information</text>
      <text class="micro" x="849" y="558">INVARIANT</text>
    </g>
    <g id="o-information" data-node="o-information">
      <rect class="invariant" x="1026" y="510" width="176" height="60" rx="11"/>
      <text class="method-title" x="1045" y="537">O-information</text>
      <text class="micro" x="1045" y="558">INVARIANT</text>
    </g>
  </g>

  <g id="categorical-mgw" data-node="categorical-mgw">
    <rect class="method" x="1260" y="388" width="468" height="210" rx="18"/>
    <text class="box-title" x="1284" y="423">Categorical MGW · fixed target</text>
    <text class="mono" x="1284" y="457">PID2(V,R;T_H)</text>
    <text class="mono" x="1284" y="485">PID3(V,R,A;T_V)</text>
    <text class="body" x="1284" y="522">Π<tspan baseline-shift="super" font-size="11">net</tspan><tspan baseline-shift="baseline"> = Π</tspan><tspan baseline-shift="super" font-size="11">+</tspan><tspan baseline-shift="baseline"> − Π</tspan><tspan baseline-shift="super" font-size="11">−</tspan><tspan baseline-shift="baseline"> · signed atoms · nats</tspan></text>
    <text class="small" x="1284" y="551">Exact categorical route; no estimator fallback.</text>
    <text class="small" x="1284" y="575">Primary PID2 · exploratory PID3.</text>
  </g>

  <path class="edge" d="M 680 326 V 354 H 197 V 471" data-edge="sensor-row->nis" data-source="sensor-row" data-target="nis"/>
  <path class="arrowhead" d="M 197 471 L 189 457 L 205 457 Z" aria-hidden="true"/>
  <path class="edge" d="M 700 326 V 360 H 421 V 471" data-edge="sensor-row->cusum" data-source="sensor-row" data-target="cusum"/>
  <path class="arrowhead" d="M 421 471 L 413 457 L 429 457 Z" aria-hidden="true"/>
  <path class="edge" d="M 720 326 V 366 H 646 V 471" data-edge="sensor-row->signed-correlation" data-source="sensor-row" data-target="signed-correlation"/>
  <path class="arrowhead" d="M 646 471 L 638 457 L 654 457 Z" aria-hidden="true"/>
  <path class="edge" d="M 770 326 V 350 H 1016 V 452" data-edge="sensor-row->ksg-mi" data-source="sensor-row" data-target="ksg-mi"/>
  <path class="arrowhead" d="M 1016 452 L 1008 438 L 1024 438 Z" aria-hidden="true"/>
  <path class="edge" d="M 790 326 V 344 H 918 V 510" data-edge="sensor-row->co-information" data-source="sensor-row" data-target="co-information"/>
  <path class="arrowhead" d="M 918 510 L 910 496 L 926 496 Z" aria-hidden="true"/>
  <path class="edge" d="M 810 326 V 338 H 1114 V 510" data-edge="sensor-row->o-information" data-source="sensor-row" data-target="o-information"/>
  <path class="arrowhead" d="M 1114 510 L 1106 496 L 1122 496 Z" aria-hidden="true"/>
  <path class="method-edge" d="M 860 326 V 348 H 1400 V 388" data-edge="sensor-row->categorical-mgw" data-source="sensor-row" data-target="categorical-mgw"/>
  <path class="arrowhead-purple" d="M 1400 388 L 1392 374 L 1408 374 Z" aria-hidden="true"/>
  <path class="method-edge" d="M 1444 326 V 388" data-edge="target->categorical-mgw" data-source="target" data-target="categorical-mgw"/>
  <path class="arrowhead-purple" d="M 1444 388 L 1436 374 L 1452 374 Z" aria-hidden="true"/>

  <g id="typed-evidence" data-node="typed-evidence">
    <rect class="evidence" x="72" y="630" width="1656" height="94" rx="16"/>
    <text class="box-title" x="96" y="665">Typed research evidence · exact join, never fallback</text>
    <text class="mono-small" x="96" y="693">question · episode/window · ordered sources · target-or-TargetFree · law · method · configuration</text>
    <text class="small" x="96" y="715">Eligibility: Applicable | Inapplicable   ·   Execution: NotRequested | Requested { Produced | Unavailable | ResourceRejected | Error }</text>
  </g>
  <path class="bus" d="M 197 565 V 614 M 421 565 V 614 M 646 565 V 614 M 918 570 V 614 M 1114 570 V 614 M 1494 598 V 614 M 197 614 H 1494"/>
  <path class="edge" d="M 900 614 V 630" data-edge="methods->typed-evidence" data-source="methods" data-target="typed-evidence"/>
  <path class="arrowhead" d="M 900 630 L 892 616 L 908 616 Z" aria-hidden="true"/>

  <rect class="firewall" x="45" y="788" width="1710" height="222" rx="22"/>
  <text class="section" x="72" y="823">B · FIXED-INPUT NONINTERFERENCE</text>
  <text class="danger" x="72" y="858">CURRENT FACT: no PID route, principal, trusted-state field, policy field, or runtime dependency exists in Haldir.</text>
  <text class="mono" x="72" y="895">Authorize(x,e) = Authorize(x)    ∧    TrustedStateSnapshot(x,e) = TrustedStateSnapshot(x)</text>
  <text class="mono" x="72" y="928">PlantCommand(x,e) = PlantCommand(x)    while    AuditRecord(x,e) may vary</text>
  <text class="small" x="72" y="960">PID cannot grant · widen · restore · refresh · revoke · restrict · deny · exercise authority.</text>
  <line x1="1320" y1="832" x2="1320" y2="977" stroke="#c92a2a" stroke-width="3"/>
  <g data-forbidden-edge="audit-reference->authority-inputs">
    <circle cx="1362" cy="902" r="29" fill="#c92a2a"/>
    <rect x="1347" y="897" width="30" height="10" rx="5" fill="#ffffff"/>
    <text class="danger" x="1406" y="878">Forbidden edge</text>
    <text class="small" x="1406" y="907">research evidence → trusted state</text>
    <text class="small" x="1406" y="932">research evidence → policy or command</text>
    <text class="small" x="1406" y="957">every atom sign is equally non-authoritative</text>
  </g>

  <rect class="panel" x="45" y="1039" width="1710" height="470" rx="22"/>
  <text class="section" x="72" y="1074">C · RECORD-ONLY AUDIT SEAM AND INDEPENDENT HALDIR AUTHORITY</text>

  <g id="audit-reference" data-node="audit-reference">
    <rect class="evidence" x="72" y="1102" width="405" height="160" rx="17"/>
    <text class="box-title" x="96" y="1138">Future audit reference</text>
    <text class="body" x="96" y="1170">Separately authorized writer and route</text>
    <text class="body" x="96" y="1197">Bounded digest; no automatic fetch</text>
    <text class="small" x="96" y="1225">NOT IMPLEMENTED · minimized data · no trust label</text>
  </g>
  <path class="edge dashed" d="M 1510 724 V 770 H 24 V 1182 H 72" data-edge="typed-evidence->audit-reference" data-source="typed-evidence" data-target="audit-reference"/>
  <path class="arrowhead" d="M 72 1182 L 58 1174 L 58 1190 Z" aria-hidden="true"/>

  <g id="trusted-state" data-node="trusted-state">
    <rect class="authority" x="650" y="1102" width="300" height="160" rx="17"/>
    <text class="box-title" x="674" y="1138">Trusted state</text>
    <text class="body" x="674" y="1170">authenticated provenance</text>
    <text class="body" x="674" y="1197">session · freshness · uncertainty</text>
    <text class="small" x="674" y="1225">No PID or advisory field.</text>
  </g>
  <g id="authority-inputs" data-node="authority-inputs">
    <rect class="authority" x="990" y="1102" width="330" height="160" rx="17"/>
    <text class="box-title" x="1014" y="1138">Authority inputs x</text>
    <text class="body" x="1014" y="1170">intent ∧ lease ∧ admission</text>
    <text class="body" x="1014" y="1197">policy ∧ replay ∧ route</text>
    <text class="small" x="1014" y="1225">Independent roles and lifecycles.</text>
  </g>
  <g id="gate-decision" data-node="gate-decision">
    <rect class="authority" x="1360" y="1102" width="368" height="160" rx="17"/>
    <text class="box-title" x="1384" y="1138">Deterministic Gate</text>
    <text class="mono" x="1384" y="1172">ALLOW(x) ⇒ new frame</text>
    <text class="mono" x="1384" y="1200">otherwise ⇒ no output</text>
    <text class="small" x="1384" y="1227">Final recheck before publication.</text>
  </g>
  <path class="authority-edge" d="M 950 1182 H 990" data-edge="trusted-state->authority-inputs" data-source="trusted-state" data-target="authority-inputs"/>
  <path class="arrowhead-gold" d="M 990 1182 L 976 1174 L 976 1190 Z" aria-hidden="true"/>
  <path class="authority-edge" d="M 1320 1182 H 1360" data-edge="authority-inputs->gate-decision" data-source="authority-inputs" data-target="gate-decision"/>
  <path class="arrowhead-gold" d="M 1360 1182 L 1346 1174 L 1346 1190 Z" aria-hidden="true"/>

  <line x1="477" y1="1182" x2="590" y2="1182" stroke="#c92a2a" stroke-width="3" stroke-dasharray="9 8"/>
  <circle cx="605" cy="1182" r="24" fill="#c92a2a"/>
  <rect x="592" y="1178" width="26" height="8" rx="4" fill="#ffffff"/>
  <text class="small" x="500" y="1221">no state/policy edge</text>

  <g id="evidence-ladder" data-node="evidence-ladder">
    <rect class="scenario" x="72" y="1310" width="1168" height="152" rx="17"/>
    <text class="box-title" x="96" y="1348">Evidence ladder · claims advance one rung at a time</text>
    <text class="body" x="96" y="1382">exact law → simulation → SITL → HIL → multi-flight replay → field study</text>
    <line class="hairline" x1="96" y1="1401" x2="1216" y2="1401"/>
    <text class="small" x="96" y="1430">Frames within a flight are dependent: split and resample by episode or mission.</text>
    <text class="small" x="96" y="1453">No scientific rung creates authority or promotes the next rung automatically.</text>
  </g>
  <g id="plant-command" data-node="plant-command">
    <rect class="authority" x="1280" y="1310" width="448" height="152" rx="17"/>
    <text class="box-title" x="1304" y="1348">Gate-owned plant command</text>
    <text class="mono" x="1304" y="1383">CreateCommand(x) iff</text>
    <text class="body" x="1304" y="1413">the independent authority conjunction holds.</text>
    <text class="small" x="1304" y="1443">No PID/advisory field; otherwise no new output.</text>
  </g>
  <path class="authority-edge" d="M 1544 1262 V 1310" data-edge="gate-decision->plant-command" data-source="gate-decision" data-target="plant-command"/>
  <path class="arrowhead-gold" d="M 1544 1310 L 1536 1296 L 1552 1296 Z" aria-hidden="true"/>

  <text class="small" x="900" y="1563" text-anchor="middle">Solid arrows are exact data or authority joins; the dashed arrow is an unimplemented record-only proposal; the red stop is the forbidden control edge.</text>
</svg>
