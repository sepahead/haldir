name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every third-party Action is pinned to an immutable commit SHA (CL-CI-02). The
# trailing version comment keeps the reviewed release human-readable.

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The pinned toolchain + components come from rust-toolchain.toml. `rustup show`
      # installs and selects it; we then verify (H-B01: the previous single-line
      # `--component rustfmt clippy` mis-parsed `clippy` as a positional toolchain).
      - name: Install + verify pinned toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
          rustc -Vv
          cargo -V
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Docs build (deny warnings)
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: git diff --check
        run: git diff --check
      - name: No generated-file drift
        run: python3 -I -B tools/verify-generated.py

  feature-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy
      # Prove the workspace compiles with minimal / no-default features too.
      - name: Build no-default-features
        run: cargo build --workspace --no-default-features --locked
      - name: Clippy default features only
        run: cargo clippy --workspace --locked -- -D warnings

  macos-compile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy
      - name: Build + test on macOS
        run: cargo test --workspace --locked

  clean-build:
    # Deliberately no restored target cache: catches warm-cache assumptions and
    # undeclared generated artifacts (runbook Phase 1 step 7).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Cold build
        run: cargo build --workspace --locked

  supply-chain:
    permissions:
      contents: read
    outputs:
      audit-result-artifact-digest: ${{ steps.upload-audit-result.outputs.artifact-digest }}
      audit-result-artifact-id: ${{ steps.upload-audit-result.outputs.artifact-id }}
      audit-result-sha256: ${{ steps.emit-audit-result.outputs.sha256 }}
    runs-on: ubuntu-24.04
    # The retained audit suite is intentionally exhaustive; c5's canonical
    # supply-chain job took 73m47s, so leave headroom for cold hosted runners.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          check-latest: false
      - name: Harden pinned Python permissions
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          PYTHON3="$(/usr/bin/readlink -f "${pythonLocation}/bin/python3")"
          /usr/bin/chmod go-w "$PYTHON3"
          /usr/bin/test -x "$PYTHON3"
      # Pull requests retain every source, pin, advisory, and security check
      # below. Only signed-linear current-audit plumbing is inapplicable to
      # GitHub's two-parent pull-request merge commit.
      - name: Install pinned GitHub CLI for offline attestation verification
        if: github.event_name != 'pull_request'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GH_CLI_ARCHIVE_BYTES: 14652560
          GH_CLI_ARCHIVE_SHA256: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
          GH_CLI_BINARY_BYTES: 40722594
          GH_CLI_BINARY_SHA256: 56b8bbbb27b066ecb33dbef9a256dc9d1314adaeff0908a752feba6c34053b40
          GH_CLI_VERSION: 2.96.0
        run: |
          GH_ROOT="${RUNNER_TEMP}/haldir-gh-${GH_CLI_VERSION}"
          GH_ARCHIVE="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 300 \
            --output "$GH_ARCHIVE" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          [[ "$(/usr/bin/stat --format=%s "$GH_ARCHIVE")" == \
            "$GH_CLI_ARCHIVE_BYTES" ]]
          printf '%s  %s\n' "$GH_CLI_ARCHIVE_SHA256" "$GH_ARCHIVE" \
            | /usr/bin/sha256sum --check --strict
          /usr/bin/mkdir -m 0700 "$GH_ROOT"
          /usr/bin/tar \
            --extract \
            --gzip \
            --file "$GH_ARCHIVE" \
            --directory "$GH_ROOT" \
            --no-same-owner \
            --no-same-permissions \
            -- "gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          GH_BIN="${GH_ROOT}/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          /usr/bin/test -f "$GH_BIN"
          /usr/bin/test ! -L "$GH_BIN"
          [[ "$(/usr/bin/stat --format=%s "$GH_BIN")" == \
            "$GH_CLI_BINARY_BYTES" ]]
          printf '%s  %s\n' "$GH_CLI_BINARY_SHA256" "$GH_BIN" \
            | /usr/bin/sha256sum --check --strict
          /usr/bin/chmod go-w "$GH_BIN"
          [[ "$("$GH_BIN" --version | /usr/bin/head -n 1)" == \
            "gh version ${GH_CLI_VERSION} (2026-07-02)" ]]
          printf 'HALDIR_FR0017_GH=%s\n' "$GH_BIN" >> "$GITHUB_ENV"
      - name: Preload isolated task-runner image
        if: github.event_name != 'pull_request'
        run: /usr/bin/docker pull python@sha256:4a3a38c8710794e278c3651352dd6195d5798eb6ec5ad41db6258e753c9e4ceb
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify current-head 0.9 audit cut
        if: github.event_name != 'pull_request'
        run: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc tools/release/current-audit-gate.sh
      - name: Verify source pins
        run: python3 -I -B tools/verify-pins.py
      - name: Verify immutable CI and formal-tool pins
        run: python3 -I -B tools/verify-ci-pins.py
      - name: Verify epoch-18 recovery primitives for current event
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              python3 -I -B -W error tools/release/test_verify_framework_recovery_fr_0017.py
              python3 -I -B -W error tools/test_pinned_cargo_deny.py
              python3 -I -B -W error tools/test_run_formal.py
              ;;
            push)
              /usr/bin/printf '%s\n' \
                'current-audit gate verified epoch-18 recovery primitives for push'
              ;;
            workflow_dispatch)
              /usr/bin/printf '%s\n' \
                'current-audit gate verified epoch-18 recovery primitives for workflow_dispatch'
              ;;
            *)
              /usr/bin/printf '%s\n' 'unsupported recovery verification event' >&2
              exit 1
              ;;
          esac
      - name: Verify immutable 0.9 audit cut
        run: |
          python3 -I -B tools/release/test_verify_audit_inputs.py
          python3 -I -B tools/release/verify-audit-inputs.py
      - name: Verify normative 0.9 authority model
        run: |
          python3 -I -B tools/release/test_verify_authority_model.py
          python3 -I -B tools/release/verify-authority-model.py
      - name: Verify normative 0.9 protection model and evidence generator
        run: |
          python3 -I -B tools/release/test_generate_task_evidence.py
          python3 -I -B tools/release/verify-task-evidence.py --all-present
          python3 -I -B tools/release/test_verify_protection_model.py
          python3 -I -B tools/release/verify-protection-model.py
      - name: Verify evidence layout
        run: python3 -I -B tools/verify-evidence.py
      - name: Verify secure Zenoh profiles and retained live evidence
        run: |
          python3 -I -B tools/test_secure_zenoh.py
          python3 -I -B tools/test_live_secure_zenoh.py
          python3 -I -B tools/test_live_gate_dev_smoke.py
          python3 -I -B tools/test_live_gate_dev_smoke_verifier.py
          python3 -I -B -c 'import runpy,sys;sys.path.append("tools");runpy.run_path("tools/verify-secure-zenoh.py",run_name="__main__")'
          python3 -I -B tools/verify-live-secure-zenoh.py
          python3 -I -B tools/verify-live-gate-dev-smoke.py
      - name: Forbidden-claim drift check
        run: python3 -I -B tools/verify-claims.py
      - name: Install verified cargo-deny and RustSec snapshot
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CARGO_DENY_URL: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          RUSTSEC_URL: https://codeload.github.com/RustSec/advisory-db/tar.gz/7c7ccac53056b87f69ac677f15ea2d9a98a6f8e2
        run: |
          DENY_ARCHIVE="${RUNNER_TEMP}/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"
          DENY_ROOT="${RUNNER_TEMP}/haldir-cargo-deny"
          RUSTSEC_ARCHIVE="${RUNNER_TEMP}/rustsec-advisory-db-7c7ccac53056b87f69ac677f15ea2d9a98a6f8e2.tar.gz"
          HALDIR_CARGO_HOME="${RUNNER_TEMP}/haldir-cargo-home"
          /usr/bin/mkdir -m 0700 "$HALDIR_CARGO_HOME"
          for record in \
            "${CARGO_DENY_URL}|${DENY_ARCHIVE}|4936832" \
            "${RUSTSEC_URL}|${RUSTSEC_ARCHIVE}|441027"
          do
            IFS='|' read -r URL OUTPUT MAX_BYTES <<< "$record"
            /usr/bin/curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --retry 3 \
              --connect-timeout 30 \
              --max-time 300 \
              --max-filesize "$MAX_BYTES" \
              --output "$OUTPUT" \
              "$URL"
          done
          python3 -I -B tools/pinned_cargo_deny.py install \
            --archive "$DENY_ARCHIVE" \
            --destination "$DENY_ROOT" \
            --target x86_64-unknown-linux-musl
          python3 -I -B tools/pinned_cargo_deny.py seed-advisory-db \
            --archive "$RUSTSEC_ARCHIVE" \
            --cargo-home "$HALDIR_CARGO_HOME" \
            --git /usr/bin/git
          printf 'CARGO_HOME=%s\n' "$HALDIR_CARGO_HOME" >> "$GITHUB_ENV"
      - name: Prime exact locked dependency inputs
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: cargo fetch --locked --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
      - name: Frozen cargo-deny with networking disabled
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TERM_COLOR: never
        run: |
          FINAL_CARGO_HOME="${RUNNER_TEMP}/haldir-cargo-home"
          FINAL_CARGO_DENY="${RUNNER_TEMP}/haldir-cargo-deny/cargo-deny"
          FINAL_RUSTSEC_DB="${FINAL_CARGO_HOME}/advisory-dbs/advisory-db-3157b0e258782691"
          ISOLATED_HOME="${RUNNER_TEMP}/haldir-cargo-deny-home"
          RUSTUP_BIN="$(/usr/bin/readlink -f "${HOME}/.cargo/bin/rustup")"
          RUSTUP_ROOT="${HOME}/.rustup"
          TOOLCHAIN_CARGO="$("$RUSTUP_BIN" which --toolchain 1.96.0 cargo)"
          TOOLCHAIN_CARGO="$(/usr/bin/readlink -f "$TOOLCHAIN_CARGO")"
          TOOLCHAIN_BIN="${TOOLCHAIN_CARGO%/*}"
          /usr/bin/mkdir -m 0700 "$ISOLATED_HOME"
          /usr/bin/test -d "$FINAL_CARGO_HOME"
          /usr/bin/test ! -L "$FINAL_CARGO_HOME"
          /usr/bin/test -f "$FINAL_CARGO_DENY"
          /usr/bin/test ! -L "$FINAL_CARGO_DENY"
          /usr/bin/test -f "$RUSTUP_BIN"
          /usr/bin/test ! -L "$RUSTUP_BIN"
          /usr/bin/test -f "$TOOLCHAIN_CARGO"
          /usr/bin/test ! -L "$TOOLCHAIN_CARGO"
          /usr/bin/test -d "$RUSTUP_ROOT"
          /usr/bin/test ! -L "$RUSTUP_ROOT"
          [[ "$FINAL_CARGO_HOME" != "$GITHUB_WORKSPACE/"* ]]
          [[ "$FINAL_CARGO_DENY" != "$GITHUB_WORKSPACE/"* ]]
          [[ "$RUSTUP_BIN" != "$GITHUB_WORKSPACE/"* ]]
          [[ "$TOOLCHAIN_CARGO" != "$GITHUB_WORKSPACE/"* ]]
          [[ -z "$(/usr/bin/find \
            "$FINAL_CARGO_DENY" "$RUSTUP_BIN" "$TOOLCHAIN_CARGO" \
            -prune -perm -022 -print)" ]]
          [[ "$("$TOOLCHAIN_CARGO" --version)" == "cargo 1.96.0 ("*")" ]]
          [[ "$(/usr/bin/stat --format=%s "$FINAL_CARGO_DENY")" == 8844624 ]]
          printf '%s  %s\n' \
            b329e25933d01c36dd7c47d84ea5716694f9b7caf53a5003d45674703a8ed54a \
            "$FINAL_CARGO_DENY" \
            | /usr/bin/sha256sum --check --strict
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_NO_REPLACE_OBJECTS=1
          [[ "$(/usr/bin/git -C "$FINAL_RUSTSEC_DB" rev-parse HEAD)" == \
            1ec5ce48144b04d9bf3e740b4dd3c2d61d8cc4ce ]]
          [[ "$(/usr/bin/git -C "$FINAL_RUSTSEC_DB" rev-parse 'HEAD^{tree}')" == \
            2d3ab21e05f8b06ad2e232f92894b5e247d817ce ]]
          [[ -z "$(/usr/bin/git -C "$FINAL_RUSTSEC_DB" status \
            --porcelain=v1 --untracked-files=all)" ]]
          RUNNER_GID="$(/usr/bin/id -g)"
          RUNNER_UID="$(/usr/bin/id -u)"
          /usr/bin/sudo --non-interactive \
            /usr/bin/unshare --net -- \
            /usr/bin/setpriv \
              --reuid="$RUNNER_UID" \
              --regid="$RUNNER_GID" \
              --clear-groups \
              --inh-caps=-all \
              --bounding-set=-all \
              --no-new-privs \
            /usr/bin/env -i \
              CARGO_HOME="$FINAL_CARGO_HOME" \
              CARGO_NET_OFFLINE="$CARGO_NET_OFFLINE" \
              CARGO_TERM_COLOR="$CARGO_TERM_COLOR" \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_NO_REPLACE_OBJECTS=1 \
              HOME="$ISOLATED_HOME" \
              LC_ALL=C \
              PATH="$TOOLCHAIN_BIN:/usr/bin:/bin" \
              RUSTUP_HOME="$RUSTUP_ROOT" \
              RUSTUP_TOOLCHAIN=1.96.0 \
              "$FINAL_CARGO_DENY" \
                --frozen \
                --all-features \
                --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
                check
      # The pull-request model is non-authoritative; trusted push/dispatch
      # events alone emit and upload the canonical recovery result.
      - name: Emit canonical epoch-18 audit result
        if: github.event_name != 'pull_request'
        id: emit-audit-result
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 -I -B tools/release/framework_recovery_fr_0017_result.py \
            --workflow ci \
            --output "epoch-18-ci-result-attempt-${GITHUB_RUN_ATTEMPT}.json"
          RESULT_SHA256="$(/usr/bin/sha256sum \
            "epoch-18-ci-result-attempt-${GITHUB_RUN_ATTEMPT}.json")"
          RESULT_SHA256="${RESULT_SHA256%% *}"
          [[ "$RESULT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$RESULT_SHA256" >> "$GITHUB_OUTPUT"
      - name: Upload canonical epoch-18 audit result
        if: github.event_name != 'pull_request'
        id: upload-audit-result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: epoch-18-ci-result-attempt-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  attest-ci-audit-result:
    if: >-
      github.repository == 'sepahead/haldir' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs:
      - build-test
      - clean-build
      - feature-matrix
      - interop
      - macos-compile
      - supply-chain
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download immutable audit result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.supply-chain.outputs.audit-result-artifact-id }}
          path: attested-audit-result
          digest-mismatch: error
      - name: Verify producer and artifact digests
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_DIGEST: ${{ needs.supply-chain.outputs.audit-result-artifact-digest }}
          RESULT_SHA256: ${{ needs.supply-chain.outputs.audit-result-sha256 }}
        run: |
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RESULT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_DIGEST" == "$RESULT_SHA256" ]]
          RESULT_PATH="attested-audit-result/epoch-18-ci-result-attempt-${GITHUB_RUN_ATTEMPT}.json"
          [[ -f "$RESULT_PATH" ]]
          [[ ! -L "$RESULT_PATH" ]]
          [[ "$(/usr/bin/find attested-audit-result -mindepth 1 -maxdepth 1 \
            -type f | /usr/bin/wc -l)" -eq 1 ]]
          printf '%s  %s\n' \
            "$RESULT_SHA256" \
            "$RESULT_PATH" \
            | /usr/bin/sha256sum --check --strict
      - name: Attest exact audit result
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: attested-audit-result/epoch-18-ci-result-attempt-${{ github.run_attempt }}.json

  interop:
    # An independent (second-implementation) check of the COSE_Sign1 /
    # deterministic-CBOR wire format (CL-INTEROP-01). Re-emits the vectors from
    # Rust, fails on any drift from the committed file, then verifies every
    # vector with the dependency-free Python verifier.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Regenerate interop vectors (drift check)
        run: |
          cargo run -q -p haldir-crypto --example emit_interop_vectors > /tmp/vectors.json
          diff -u tools/interop/vectors.json /tmp/vectors.json
      - name: Independently verify COSE/CBOR vectors
        run: python3 -I -B tools/interop/verify_cose.py tools/interop/vectors.json
