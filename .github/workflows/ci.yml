name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every third-party Action is pinned to an immutable commit SHA (CL-CI-02). The
# trailing version comment keeps the reviewed release human-readable.

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The pinned toolchain + components come from rust-toolchain.toml. `rustup show`
      # installs and selects it; we then verify (H-B01: the previous single-line
      # `--component rustfmt clippy` mis-parsed `clippy` as a positional toolchain).
      - name: Install + verify pinned toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
          rustc -Vv
          cargo -V
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Doc tests
        run: cargo test --workspace --doc --locked
      - name: Docs build (deny warnings)
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: git diff --check
        run: git diff --check
      - name: No generated-file drift
        run: python3 tools/verify-generated.py

  feature-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy
      # Prove the workspace compiles with minimal / no-default features too.
      - name: Build no-default-features
        run: cargo build --workspace --no-default-features --locked
      - name: Clippy default features only
        run: cargo clippy --workspace --locked -- -D warnings

  macos-compile:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy
      - name: Build + test on macOS
        run: cargo test --workspace --locked

  clean-build:
    # Deliberately no restored target cache: catches warm-cache assumptions and
    # undeclared generated artifacts (runbook Phase 1 step 7).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Cold build
        run: cargo build --workspace --locked

  supply-chain:
    permissions:
      contents: read
    outputs:
      audit-result-artifact-digest: ${{ steps.upload-audit-result.outputs.artifact-digest }}
      audit-result-artifact-id: ${{ steps.upload-audit-result.outputs.artifact-id }}
      audit-result-sha256: ${{ steps.emit-audit-result.outputs.sha256 }}
    runs-on: ubuntu-24.04
    # The retained audit suite is intentionally exhaustive; c5's canonical
    # supply-chain job took 73m47s, so leave headroom for cold hosted runners.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
          check-latest: false
      - name: Harden pinned Python permissions
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          PYTHON3="$(/usr/bin/readlink -f "${pythonLocation}/bin/python3")"
          /usr/bin/chmod go-w "$PYTHON3"
          /usr/bin/test -x "$PYTHON3"
      - name: Install pinned GitHub CLI for offline attestation verification
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GH_CLI_ARCHIVE_BYTES: 14642738
          GH_CLI_ARCHIVE_SHA256: 25d1e4729e8808c9ed3d613e96ebd3f3e44446f2d368c89d878a71a36ddb3d8c
          GH_CLI_BINARY_BYTES: 40702114
          GH_CLI_BINARY_SHA256: 62c11fbaa08835168c3d1acf8a645ac6268a13a5682c73581388c9df0c622617
          GH_CLI_VERSION: 2.95.0
        run: |
          GH_ROOT="${RUNNER_TEMP}/haldir-gh-${GH_CLI_VERSION}"
          GH_ARCHIVE="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          /usr/bin/curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --tlsv1.2 \
            --retry 3 \
            --connect-timeout 30 \
            --max-time 300 \
            --output "$GH_ARCHIVE" \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          [[ "$(/usr/bin/stat --format=%s "$GH_ARCHIVE")" == \
            "$GH_CLI_ARCHIVE_BYTES" ]]
          printf '%s  %s\n' "$GH_CLI_ARCHIVE_SHA256" "$GH_ARCHIVE" \
            | /usr/bin/sha256sum --check --strict
          /usr/bin/mkdir -m 0700 "$GH_ROOT"
          /usr/bin/tar \
            --extract \
            --gzip \
            --file "$GH_ARCHIVE" \
            --directory "$GH_ROOT" \
            --no-same-owner \
            --no-same-permissions \
            -- "gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          GH_BIN="${GH_ROOT}/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          /usr/bin/test -f "$GH_BIN"
          /usr/bin/test ! -L "$GH_BIN"
          [[ "$(/usr/bin/stat --format=%s "$GH_BIN")" == \
            "$GH_CLI_BINARY_BYTES" ]]
          printf '%s  %s\n' "$GH_CLI_BINARY_SHA256" "$GH_BIN" \
            | /usr/bin/sha256sum --check --strict
          /usr/bin/chmod go-w "$GH_BIN"
          [[ "$("$GH_BIN" --version | /usr/bin/head -n 1)" == \
            "gh version ${GH_CLI_VERSION} (2026-06-17)" ]]
          printf 'HALDIR_FR0013_GH=%s\n' "$GH_BIN" >> "$GITHUB_ENV"
      - name: Preload isolated task-runner image
        run: /usr/bin/docker pull python@sha256:4a3a38c8710794e278c3651352dd6195d5798eb6ec5ad41db6258e753c9e4ceb
      - name: Verify current-head 0.9 audit cut
        run: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc tools/release/current-audit-gate.sh
      - name: Verify source pins
        run: python3 tools/verify-pins.py
      - name: Verify immutable CI and formal-tool pins
        run: python3 tools/verify-ci-pins.py
      - name: Verify immutable 0.9 audit cut
        run: |
          python3 -m unittest tools/release/test_verify_audit_inputs.py
          python3 tools/release/verify-audit-inputs.py
      - name: Verify normative 0.9 authority model
        run: |
          python3 -m unittest tools/release/test_verify_authority_model.py
          python3 tools/release/verify-authority-model.py
      - name: Verify normative 0.9 protection model and evidence generator
        run: |
          python3 -m unittest tools/release/test_generate_task_evidence.py
          python3 tools/release/verify-task-evidence.py --all-present
          python3 -m unittest tools/release/test_verify_protection_model.py
          python3 tools/release/verify-protection-model.py
      - name: Verify evidence layout
        run: python3 tools/verify-evidence.py
      - name: Verify secure Zenoh profiles and retained live evidence
        run: |
          python3 -m unittest \
            tools/test_secure_zenoh.py \
            tools/test_live_secure_zenoh.py \
            tools/test_live_gate_dev_smoke.py \
            tools/test_live_gate_dev_smoke_verifier.py
          python3 tools/verify-secure-zenoh.py
          python3 tools/verify-live-secure-zenoh.py
          python3 tools/verify-live-gate-dev-smoke.py
      - name: Forbidden-claim drift check
        run: python3 tools/verify-claims.py
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
      - name: Emit canonical epoch-14 audit result
        id: emit-audit-result
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 tools/release/framework_recovery_fr_0013_result.py \
            --workflow ci \
            --output "epoch-14-ci-result-attempt-${GITHUB_RUN_ATTEMPT}.json"
          RESULT_SHA256="$(/usr/bin/sha256sum \
            "epoch-14-ci-result-attempt-${GITHUB_RUN_ATTEMPT}.json")"
          RESULT_SHA256="${RESULT_SHA256%% *}"
          [[ "$RESULT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$RESULT_SHA256" >> "$GITHUB_OUTPUT"
      - name: Upload canonical epoch-14 audit result
        id: upload-audit-result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: epoch-14-ci-result-attempt-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  attest-ci-audit-result:
    if: >-
      github.repository == 'sepahead/haldir' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs:
      - build-test
      - clean-build
      - feature-matrix
      - interop
      - macos-compile
      - supply-chain
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download immutable audit result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.supply-chain.outputs.audit-result-artifact-id }}
          path: attested-audit-result
          digest-mismatch: error
      - name: Verify producer and artifact digests
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_DIGEST: ${{ needs.supply-chain.outputs.audit-result-artifact-digest }}
          RESULT_SHA256: ${{ needs.supply-chain.outputs.audit-result-sha256 }}
        run: |
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RESULT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_DIGEST" == "$RESULT_SHA256" ]]
          RESULT_PATH="attested-audit-result/epoch-14-ci-result-attempt-${GITHUB_RUN_ATTEMPT}.json"
          [[ -f "$RESULT_PATH" ]]
          [[ ! -L "$RESULT_PATH" ]]
          [[ "$(/usr/bin/find attested-audit-result -mindepth 1 -maxdepth 1 \
            -type f | /usr/bin/wc -l)" -eq 1 ]]
          printf '%s  %s\n' \
            "$RESULT_SHA256" \
            "$RESULT_PATH" \
            | /usr/bin/sha256sum --check --strict
      - name: Attest exact audit result
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: attested-audit-result/epoch-14-ci-result-attempt-${{ github.run_attempt }}.json

  interop:
    # An independent (second-implementation) check of the COSE_Sign1 /
    # deterministic-CBOR wire format (CL-INTEROP-01). Re-emits the vectors from
    # Rust, fails on any drift from the committed file, then verifies every
    # vector with the dependency-free Python verifier.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Regenerate interop vectors (drift check)
        run: |
          cargo run -q -p haldir-crypto --example emit_interop_vectors > /tmp/vectors.json
          diff -u tools/interop/vectors.json /tmp/vectors.json
      - name: Independently verify COSE/CBOR vectors
        run: python3 tools/interop/verify_cose.py tools/interop/vectors.json
