name: formal

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tlc-model-check:
    permissions:
      contents: read
    outputs:
      audit-result-artifact-digest: ${{ steps.upload-audit-result.outputs.artifact-digest }}
      audit-result-artifact-id: ${{ steps.upload-audit-result.outputs.artifact-id }}
      audit-result-sha256: ${{ steps.emit-audit-result.outputs.sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TLA_TOOLS_VERSION: "1.7.4"
      TLA_TOOLS_SHA256: "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JRE
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch pinned TLA+ tools
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLA_TOOLS_VERSION}/tla2tools.jar"
          echo "${TLA_TOOLS_SHA256}  tla2tools.jar" | sha256sum --check --strict
      - name: Model-check HaldirAuthority
        run: |
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC \
            -workers auto \
            -config formal/HaldirAuthority.cfg \
            formal/HaldirAuthority.tla | tee tlc.log
          grep -q "Model checking completed. No error has been found." tlc.log
      - name: Emit canonical epoch-15 formal result
        id: emit-audit-result
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 tools/release/framework_recovery_fr_0014_result.py \
            --workflow formal \
            --output "epoch-15-formal-result-attempt-${GITHUB_RUN_ATTEMPT}.json"
          RESULT_SHA256="$(/usr/bin/sha256sum \
            "epoch-15-formal-result-attempt-${GITHUB_RUN_ATTEMPT}.json")"
          RESULT_SHA256="${RESULT_SHA256%% *}"
          [[ "$RESULT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$RESULT_SHA256" >> "$GITHUB_OUTPUT"
      - name: Upload canonical epoch-15 formal result
        id: upload-audit-result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: epoch-15-formal-result-attempt-${{ github.run_attempt }}.json
          archive: false
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Upload TLC log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tlc-log-attempt-${{ github.run_attempt }}
          path: tlc.log

  attest-formal-audit-result:
    if: >-
      github.repository == 'sepahead/haldir' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: tlc-model-check
    permissions:
      artifact-metadata: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download immutable formal result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.tlc-model-check.outputs.audit-result-artifact-id }}
          path: attested-formal-result
          digest-mismatch: error
      - name: Verify producer and artifact digests
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_DIGEST: ${{ needs.tlc-model-check.outputs.audit-result-artifact-digest }}
          RESULT_SHA256: ${{ needs.tlc-model-check.outputs.audit-result-sha256 }}
        run: |
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RESULT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_DIGEST" == "$RESULT_SHA256" ]]
          RESULT_PATH="attested-formal-result/epoch-15-formal-result-attempt-${GITHUB_RUN_ATTEMPT}.json"
          [[ -f "$RESULT_PATH" ]]
          [[ ! -L "$RESULT_PATH" ]]
          [[ "$(/usr/bin/find attested-formal-result -mindepth 1 -maxdepth 1 \
            -type f | /usr/bin/wc -l)" -eq 1 ]]
          printf '%s  %s\n' \
            "$RESULT_SHA256" \
            "$RESULT_PATH" \
            | /usr/bin/sha256sum --check --strict
      - name: Attest exact formal result
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: attested-formal-result/epoch-15-formal-result-attempt-${{ github.run_attempt }}.json
