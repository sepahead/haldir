version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "lockfile-only"
    allow:
      - dependency-type: "all"
    ignore:
      # Cargo.lock legitimately carries parallel incompatible getrandom lines.
      # Their migrations belong to manifest or parent-crate updates; asking
      # Cargo to replace one line with an already-present incompatible line
      # produces no lockfile change.
      - dependency-name: "getrandom"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
