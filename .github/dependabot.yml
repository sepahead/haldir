version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "lockfile-only"
    # Disable routine version-update pull requests. GitHub documents this
    # limit as independent from Dependabot security-update pull requests.
    open-pull-requests-limit: 0
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    commit-message:
      prefix: "chore(deps)"
